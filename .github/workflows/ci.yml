name: CI

on: [push, pull_request, workflow_dispatch]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.dotnet.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Windows, os: windows-2025 }
          - { name: macOS, os: macos-15 }
        dotnet:
          - { name: .NET 10, version: "10.0.x" }
          - { name: .NET 11, version: "11.0.x" }

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup .NET ${{ matrix.dotnet.version }} SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet.version }}
      - name: Enforce SDK Version
        run: dotnet new globaljson --sdk-version ${{ steps.setup-dotnet.outputs.dotnet-version }} --force
      - name: Verify SDK Installation
        run: dotnet --info
        continue-on-error: true
      - name: Verify static database movement census
        shell: bash
        run: |
          python Tools/SdbDump/selftest.py
          python -m unittest discover -s Tools/SdbDump -p 'test_*.py'
          python Tools/SdbDump/npc_movement_audit.py --check
          python Tools/SdbDump/verify_ability_chains.py --check
      - name: Install Dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --configuration Release --no-build --logger "console;verbosity=detailed" --logger "trx;LogFileName=tests.trx" 2>&1 | tee "$RUNNER_TEMP/test-output.log"
      - name: Report test results
        if: always()
        shell: bash
        run: |
          # Keep full failing-case arguments/messages accessible through the checks API even
          # when the Actions log-download endpoint is unavailable to a development sandbox.
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          def escape(text):
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for path in pathlib.Path('.').rglob('tests.trx'):
              root = ET.parse(path).getroot()
              counters = root.find('.//{*}Counters')
              if counters is not None:
                  print('::notice title=Test totals::' + escape(str(counters.attrib)))
              failed = [r for r in root.findall('.//{*}UnitTestResult') if r.get('outcome') == 'Failed']
              for result in failed[:8]:
                  message = result.find('.//{*}Message')
                  details = message.text if message is not None else 'No error message'
                  print('::error::' + escape(result.get('testName', '') + '\n' + details))
          PY
      - name: Publish
        if: matrix.platform.name == 'Windows' && matrix.dotnet.name == '.NET 10'
        run: |
          dotnet publish UdpHosts/GameServer/GameServer.csproj --runtime win-x64 --no-self-contained --configuration Release -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true -o Publish
          dotnet publish UdpHosts/MatrixServer/MatrixServer.csproj --runtime win-x64 --no-self-contained --configuration Release -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true -o Publish
          dotnet publish WebHosts/WebHostManager/WebHostManager.csproj --runtime win-x64 --no-self-contained --configuration Release -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true -o Publish
          cp ./Start.cmd ./Publish
          cp ./README.md ./Publish
          cp ./CHANGELOG.md ./Publish
      - name: Verify publish payload
        if: matrix.platform.name == 'Windows' && matrix.dotnet.name == '.NET 10'
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $PWD 'Publish'

          function Assert-SingleFileHost([string] $directory, [string] $name) {
            $executable = Join-Path $directory "$name.exe"
            if (-not (Test-Path -LiteralPath $executable)) {
              throw "$name publish is missing $name.exe."
            }

            # A framework-dependent single-file publish keeps the managed dependency
            # closure inside the executable. A leftover $name.dll is what Smart App
            # Control (Code Integrity event 3077 / VerifiedAndReputableDesktop) blocked.
            $unexpectedFiles = @("$name.dll", "$name.deps.json") |
              Where-Object { Test-Path -LiteralPath (Join-Path $directory $_) }
            if ($unexpectedFiles) {
              throw "$name was not bundled as a single file; found: $($unexpectedFiles -join ', ')"
            }

            if ((Get-Item -LiteralPath $executable).Length -lt 1MB) {
              throw "$name.exe is too small to contain its managed dependency bundle."
            }
          }

          Assert-SingleFileHost $publishDirectory 'GameServer'
          Assert-SingleFileHost $publishDirectory 'MatrixServer'
          Assert-SingleFileHost $publishDirectory 'WebHostManager'

          $appsettings = Join-Path $publishDirectory 'config\appsettings.json'
          if (-not (Test-Path -LiteralPath $appsettings)) {
            throw 'WebHostManager publish is missing config/appsettings.json (must stay a loose file next to the single-file exe).'
          }

          $marketData = Join-Path $publishDirectory 'Data\ItemDisplayAttributes.json'
          if (-not (Test-Path -LiteralPath $marketData)) {
            throw 'WebHostManager publish is missing Data/ItemDisplayAttributes.json (must stay a loose file next to the single-file exe).'
          }
      - name: Smoke-test GameServer startup (Bitter load)
        if: matrix.platform.name == 'Windows' && matrix.dotnet.name == '.NET 10'
        shell: pwsh
        run: |
          # Boot the published single-file GameServer far enough to force the Bitter
          # assembly load: resolving the server constructs FauFau's StaticDB (which
          # derives from Bitter's BinaryWrapper) whenever StaticDBPath points at an
          # existing file. The dummy file carries a 0xFFFFFFFF payload size in the
          # .sd2 header, so SDB parsing throws immediately after Bitter is loaded: a
          # healthy build exits 1 with that parse error, while a build with Bitter
          # missing from its bundle exits 1 with the missing-assembly signature.
          $publishDirectory = Join-Path $PWD 'Publish'
          $executable = Join-Path $publishDirectory 'GameServer.exe'
          $configPath = Join-Path $publishDirectory 'GameServer.config.json'
          $dummySdb = Join-Path $publishDirectory 'smoke-clientdb.sd2'
          $stdoutLog = Join-Path $env:RUNNER_TEMP 'gameserver-smoke-stdout.log'
          $stderrLog = Join-Path $env:RUNNER_TEMP 'gameserver-smoke-stderr.log'

          $configBackup = "$configPath.smoke-bak"
          $hadConfig = Test-Path -LiteralPath $configPath
          if ($hadConfig) {
            Copy-Item -LiteralPath $configPath -Destination $configBackup -Force
          }

          try {
            [IO.File]::WriteAllBytes($dummySdb, [byte[]](0, 0, 0, 0, 0, 0, 0, 0, 255, 255, 255, 255, 0, 0, 0, 0))
            @{ StaticDBPath = $dummySdb; MapsPath = $publishDirectory; AssetDBPath = $publishDirectory; CachePath = '' } |
              ConvertTo-Json | Set-Content -LiteralPath $configPath -Encoding utf8

            Remove-Item -LiteralPath $stdoutLog, $stderrLog -Force -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $executable -WorkingDirectory $publishDirectory `
              -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog `
              -NoNewWindow -PassThru
            $process | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue
            if (-not $process.HasExited) {
              $process | Stop-Process -Force
              throw 'Smoke test timed out: GameServer did not exit within 120 seconds.'
            }

            $output = ((Get-Content -LiteralPath $stdoutLog -Raw) + "`n" + (Get-Content -LiteralPath $stderrLog -Raw))
            Write-Host $output
            $hasTerminated = $output -match 'GameServer terminated:'
            $hasBitterError = $output -match "Could not load file or assembly 'Bitter'"
            $hasIncompleteError = $output -match 'installation is incomplete'
            # ConfigurationManager resolves app.config through Assembly.CodeBase, which is unsupported
            # in a single-file bundle. Reading settings through it used to kill startup before the
            # Firefall paths were even read; AppConfigFile parses the XML from disk instead.
            $hasSingleFileConfigError = $output -match 'CodeBase' -or $output -match 'single-file bundle'
            # Proves configuration loading, logging setup and settings resolution all completed.
            $reachedStaticDb = $output -match 'Opening SDB from'

            if ($process.ExitCode -eq 0) {
              throw 'Smoke test expected GameServer to fail on the dummy StaticDB file.'
            }

            if (-not $hasTerminated) {
              throw 'Smoke test did not reach managed startup.'
            }

            if ($hasBitterError -or $hasIncompleteError) {
              throw 'GameServer failed to load the Bitter runtime assembly from its single-file bundle.'
            }

            if ($hasSingleFileConfigError) {
              throw 'GameServer crashed reading its configuration inside the single-file bundle (Assembly.CodeBase).'
            }

            if (-not $reachedStaticDb) {
              throw 'GameServer did not get past configuration loading to opening the StaticDB.'
            }
          }
          finally {
            Remove-Item -LiteralPath $dummySdb, $stdoutLog, $stderrLog -Force -ErrorAction SilentlyContinue
            if ($hadConfig) {
              Move-Item -LiteralPath $configBackup -Destination $configPath -Force
            } else {
              Remove-Item -LiteralPath $configPath -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Smoke-test WebHostManager
        if: matrix.platform.name == 'Windows' && matrix.dotnet.name == '.NET 10'
        shell: pwsh
        run: |
          # --trust-cert is a one-shot path: load config, resolve the (localhost) certificate,
          # print "Nothing to trust..." and exit 1. That is enough to prove the single-file
          # WebHostManager.exe can start without CodeBase / could-not-load-assembly, without
          # binding the web ports this runner may not have free. A real SAC 3077 block would
          # never reach this output.
          $publishDirectory = Join-Path $PWD 'Publish'
          $executable = Join-Path $publishDirectory 'WebHostManager.exe'
          $stdoutLog = Join-Path $env:RUNNER_TEMP 'webhostmanager-smoke-stdout.log'
          $stderrLog = Join-Path $env:RUNNER_TEMP 'webhostmanager-smoke-stderr.log'
          Remove-Item -LiteralPath $stdoutLog, $stderrLog -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $executable -ArgumentList '--trust-cert' -WorkingDirectory $publishDirectory `
            -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog `
            -NoNewWindow -PassThru
          $process | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          if (-not $process.HasExited) {
            $process | Stop-Process -Force
            throw 'Smoke test timed out: WebHostManager.exe --trust-cert did not exit within 60 seconds.'
          }
          $output = ((Get-Content -LiteralPath $stdoutLog -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content -LiteralPath $stderrLog -Raw -ErrorAction SilentlyContinue))
          Write-Host $output
          if ($output -match 'CodeBase' -or $output -match 'Could not load file or assembly' -or $output -match 'SingleFileBundle' -or $output -match 'Failed to probe') {
            throw "WebHostManager.exe --trust-cert failed to load the single-file host.`n$output"
          }
          if ($process.ExitCode -ne 1) {
            throw "WebHostManager.exe --trust-cert exited $($process.ExitCode); expected 1 (localhost has nothing to trust)."
          }
          if ($output -notmatch 'Nothing to trust') {
            throw "WebHostManager.exe --trust-cert did not print the localhost trust message.`n$output"
          }
      - name: Upload Artifact
        if: matrix.platform.name == 'Windows' && matrix.dotnet.name == '.NET 10'
        uses: actions/upload-artifact@v6
        with:
          name: PIN-${{ github.sha }}
          path: Publish
          include-hidden-files: true
